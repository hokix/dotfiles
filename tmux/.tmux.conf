unbind C-b
set -g prefix C-x

bind r source-file ~/.tmux.conf \; display "Reloaded!"

set -g default-command zsh

bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind S setw synchronize-panes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
set-window-option -g automatic-rename on
# bind / copy-mode \; send-key ?
bind t {
   run-shell 'tmux list-panes -F "#{pane_id}:#{pane_title}" | grep -q ":term$" || (tmux split-window -c "#{pane_current_path}" && tmux select-pane -T term && tmux resize-pane -D 10)'
}
bind T clock-mode
bind C-x send-prefix
# ccmux
bind C-p run-shell -C 'display-popup -c "#{client_tty}" -e "CCMUX_CLIENT_TTY=#{client_tty}" -E -w 80% -h 75% "ccmux"'

set -g set-clipboard on
set -g allow-passthrough all
set -g extended-keys on
set -g extended-keys-format csi-u

set-option -sg escape-time 10
set-option -g focus-events on
set-option -sa terminal-features 'XXX:RGB'
set-window-option -g mode-keys vi

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'fabioluciano/tmux-powerkit'
set -g @plugin 'ofirgall/tmux-window-name'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'kristijan/fzf-pane-switch.tmux'
# INFO: These plugins must be loaded last to take effect
# https://github.com/tmux-plugins/tmux-continuum/tree/master?tab=readme-ov-file#known-issues
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# powerkit
set -g @powerkit_plugins "datetime,battery,hostname"
set -g @powerkit_theme "catppuccin"
set -g @powerkit_theme_variant "mocha"
# set -g @powerkit_theme "tokyonight"
# set -g @powerkit_theme_variant "storm"
set -g @powerkit_status_position "bottom"
set -g @powerkit_transparent "true"
set -g @powerkit_elements_spacing "false"
set -g @powerkit_plugin_datetime_format "%m-%d %A %H:%M"

# fzf-pane-switch
set -g @fzf_pane_switch_layout "two-row"
set -g @fzf_pane_switch_two-row-style "connected"
set -g @fzf_pane_switch_row-1-format "pane_title pane_current_command"
set -g @fzf_pane_switch_row-2-format "session_name window_name pane_current_path"
set -g @fzf_pane_switch_row-1-colours "#89b4fa:bold #a6e3a1"
set -g @fzf_pane_switch_row-2-colours "#f9e2af #cba6f7 #89b4fa"
set -g @fzf_pane_switch_colour-separator "#6c7086"
set -g @fzf_pane_switch_preview-pane "true"
set -g @fzf_pane_switch_preview-pane-start "hidden"
set -g @fzf_pane_switch_footer "true"
set -g @fzf_pane_switch_jump-labels "true"
set -g @fzf_pane_switch_refresh "true"

# resurrect
set -g @resurrect-strategy-nvim 'session'

# continuum
set -g @continuum-boot 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"
run '~/.tmux/plugins/tpm/tpm'

# set -g status-bg default
# set -g status-style "bg=default"

# Undercurl
# set -g default-terminal "${TERM}"
set -ag terminal-overrides ",${TERM}:RGB"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colours - needs tmux-3.0

if-shell "uname | grep -q Darwin" "source-file ~/.tmux-osx" "source-file ~/.tmux-linux"
